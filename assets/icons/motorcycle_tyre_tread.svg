<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 160" width="100%" height="100%">
  <defs>
    <!-- Single Repeating Module for Seamless Motorcycle Track -->
    <pattern id="moto-track-tracer" width="80" height="40" patternUnits="userSpaceOnUse">
      
      <!-- Base Color/Fill (Black) -->
      <g fill="#1a1a1a">
        <!-- 
          Central Continuous Rib 
          This provides the primary definition and continuous line effect for the route marker.
        -->
        <rect x="36" y="0" width="8" height="40" rx="1.5" />

        <!-- 
          Left Asymmetrical Siping/Block 
          Interlocking, rounded design suitable for motorbike aesthetics.
        -->
        <path d="M 22,2 L 32,15 C 32,22 28,26 22,26 Z" />
        
        <!--
          Right Asymmetrical Siping/Block
          Slightly staggered from the left side to simulate modern sport/touring tread.
        -->
        <path d="M 58,16 L 48,29 C 48,36 52,40 58,40 Z" />

        <!-- Smaller stabilizing lug (Left) -->
        <path d="M 12,32 L 20,38 L 12,38 C 10,38 8,36 8,34 Z" />
        
        <!-- Smaller stabilizing lug (Right) -->
        <path d="M 68,0 L 60,6 L 68,6 C 70,6 72,8 72,10 Z" />
      </g>
    </pattern>
  </defs>

  <!-- Continuous Track Strip -->
  <!-- Apply this pattern fill for Map Polyline Extrusions/Stroke Styles -->
  <rect width="80" height="160" fill="url(#moto-track-tracer)" />
</svg>
