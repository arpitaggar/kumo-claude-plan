name: kumo_claude
description: "Kumo - A collaborative travel planning super-app with real-time sync, AI-powered itinerary generation, expense splitting, and fintech integration."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1
  flutter: ">=3.13.0"

dependencies:
  connectivity_plus: ^6.0.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.0.5
  file_picker: ^12.0.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  flutter_map: ^7.0.2
  flutter_riverpod: ^2.4.0
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.0.0
  go_router: ^14.0.0
  google_maps_flutter: ^2.9.0
  hooks_riverpod: ^2.4.0
  http: ^1.2.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  json_annotation: ^4.8.0
  json_serializable: ^6.7.0
  latlong2: ^0.9.1
  logger: ^2.0.0
  mobile_scanner: ^7.4.0
  path_provider: ^2.1.0
  qr_flutter: ^4.1.0
  riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  share_plus: ^13.2.0
  shared_preferences: ^2.2.0
  supabase: ^2.12.0
  supabase_flutter: ^2.0.0
  url_launcher: ^6.3.0
  uuid: ^4.0.0
  xml: ^6.5.0

dev_dependencies:
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_secure_storage_platform_interface: ^2.0.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#F5F2EB"
  adaptive_icon_foreground: "assets/icons/adaptive_icon_foreground.png"
  web:
    generate: false
  windows:
    generate: false

flutter_native_splash:
  android: true
  ios: false                    # iOS launch screen is managed via LaunchScreen.storyboard
  color: "#0E1B33"              # warmOatmeal — plain background only; Flutter SplashPage handles the logo

  android_12:
    image: assets/icons/adaptive_icon_foreground.png
    color: "#0E1B33"            # Must match top-level color — eliminates background mismatch
    icon_background_color: "#0E1B33"  # Circle bg = splash bg → circle border is invisible
